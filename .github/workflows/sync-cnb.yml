name: Sync source to CNB master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CNB credentials
        id: validate
        env:
          CNB_PUSH_USERNAME: ${{ secrets.CNB_PUSH_USERNAME }}
          CNB_PUSH_TOKEN: ${{ secrets.CNB_PUSH_TOKEN }}
        run: |
          if [ -z "${CNB_PUSH_USERNAME}" ] || [ -z "${CNB_PUSH_TOKEN}" ]; then
            echo "::warning::CNB 凭据未配置（仓库 Secrets 缺少 CNB_PUSH_USERNAME / CNB_PUSH_TOKEN），跳过同步到 cnb.cool。"
            echo "cnb_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "cnb_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push source only to CNB master
        if: steps.validate.outputs.cnb_enabled == 'true'
        env:
          CNB_PUSH_USERNAME: ${{ secrets.CNB_PUSH_USERNAME }}
          CNB_PUSH_TOKEN: ${{ secrets.CNB_PUSH_TOKEN }}
          CNB_REPOSITORY_URL: https://cnb.cool/oneclickvirt/oneclickvirt
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git remote add cnb "${CNB_REPOSITORY_URL}"
          git -c credential.helper='!f() { test "$1" = get || exit 0; printf "%s\n" "username=${CNB_PUSH_USERNAME}" "password=${CNB_PUSH_TOKEN}"; }; f' \
            push --force cnb HEAD:refs/heads/master
