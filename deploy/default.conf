map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API 速率限制：每个 IP 每秒 30 个请求，突发 60
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 登录/注册速率限制：每个 IP 每秒 5 个请求
limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=5r/s;

# 上游连接池
upstream backend {
    server api:8888;
    keepalive 32;
    keepalive_requests 1000;
    # keepalive_timeout 移除：WebSocket 长连接不应被上游超时断开
}

# ── HTTP: 仅保留 ACME 验证用于证书续期，其余全部跳转 HTTPS ──
server {
    listen 80;
    server_name webhost.ypvps.com;

    # Let's Encrypt ACME 验证 (certbot webroot 模式)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ──
server {
    listen 443 ssl;
    http2 on;
    server_name webhost.ypvps.com;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # SSL 证书（宿主机 /etc/letsencrypt 只读挂载进来）
    ssl_certificate     /etc/letsencrypt/live/webhost.ypvps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhost.ypvps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（强制浏览器后续仅走 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 登录/注册接口使用更严格的速率限制
    location ~ ^/api/v1/auth/(login|register|send-verify-code) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理（Agent 反向连接 / SSH 终端 / Exec 终端）
    # 必须放在通用 /api/ location 之前，nginx 对正则 location 按首次匹配优先
    # 关键：关闭代理缓冲（proxy_buffering off），WebSocket 帧必须实时透传
    location ~ ^/api/v1/ws/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API 和 Swagger
    location ~ ^/(api|swagger)/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # 静态资源（长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，确保获取最新版本
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
